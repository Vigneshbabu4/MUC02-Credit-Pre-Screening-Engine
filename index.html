<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credit Pre-Screening Engine · Interactive Deck</title>
<style>
:root{--or:#F57C00;--bl:#1565C0;--bk:#111;--wh:#fff;--gr:#F2F4F7;--mg:#5F6B7A}
*{box-sizing:border-box;margin:0}body{background:#0b0b0b;font-family:Calibri,'Segoe UI',Arial,sans-serif;overflow:hidden;color:var(--bk)}
#stage{position:absolute;width:1280px;height:720px;transform-origin:0 0}
.slide{position:absolute;inset:0;background:var(--wh);padding:44px 60px;display:none}
.slide.on{display:block;animation:f .35s}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.dark{background:var(--bk);color:#fff}
h1{font-size:40px;font-weight:800;max-width:960px}h2{font-size:22px;margin-bottom:8px}
.pill{position:absolute;right:60px;top:50px;padding:6px 18px;border-radius:20px;color:#fff;font-weight:700;font-size:16px}
.body{margin-top:26px;font-size:19px;line-height:1.4}
.row{display:flex;gap:22px}.row>*{flex:1}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:var(--gr);border-radius:12px;padding:16px 20px;box-shadow:0 2px 8px #0002}
.card b{display:block;font-size:40px}.card span{font-size:17px}
.mut{color:var(--mg);font-size:16px}.hl{color:var(--or)}.bl{color:var(--bl)}
table{border-collapse:collapse;width:100%;font-size:17px}th{background:var(--bk);color:#fff;padding:8px}td{padding:8px;border:1px solid #d0d5db;text-align:center}td:first-child{text-align:left;font-weight:700}tr:nth-child(even) td{background:var(--gr)}tr.hi td{background:#FFE0B2!important}
ul{padding-left:22px}li{margin-bottom:9px}
.cols{display:flex;gap:10px;align-items:flex-end;height:250px;margin-bottom:40px;border-bottom:2px solid #ccc}.col{flex:1;text-align:center;font-size:14px}.col i{display:block;margin:0 auto;width:70%}.col em{font-style:normal;font-weight:700;display:block}.col u{text-decoration:none;position:absolute;margin-top:6px;font-size:13px;color:var(--mg)}
.cw{display:flex;gap:10px;margin-bottom:30px}.ct{font-weight:700;margin-bottom:6px}
.hb{display:flex;align-items:center;margin:5px 0;font-size:16px}.hb s{width:190px;text-decoration:none}.hb div{flex:1;display:flex;height:24px;background:#eef0f3;border-radius:4px;overflow:hidden}.hb div i{display:flex;align-items:center;justify-content:center;color:#fff;font:700 13px Calibri,sans-serif;font-style:normal}
.big{font-size:100px;font-weight:800;color:#fff;width:230px;height:230px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:absolute;right:120px;top:210px}
.ok{background:#2e7d32}.bad{background:#c62828}.badge{display:inline-block;color:#fff;padding:4px 14px;border-radius:14px;font-weight:700;font-size:16px}
input[type=range]{width:100%;accent-color:var(--or)}label{font-weight:700;font-size:16px;display:flex;justify-content:space-between}
svg text{font-family:Calibri,sans-serif}.drag{cursor:ew-resize}
#nav{position:fixed;bottom:0;left:0;right:0;height:44px;background:#000;display:flex;align-items:center;gap:14px;padding:0 16px;color:#fff;font-size:14px}
#nav button{background:var(--or);border:0;color:#fff;font-weight:700;padding:6px 16px;border-radius:6px;cursor:pointer}#bar{flex:1;height:6px;background:#333;border-radius:3px}#bar i{display:block;height:100%;background:var(--bl);border-radius:3px;transition:width .3s}
</style></head><body>
<div id="stage"></div>
<div id="nav"><button id="pv">◀</button><span id="ct"></span><div id="bar"><i></i></div><span>← → keys · drag the lines on slide 12; sliders on 12, 13, 21</span><button id="nx">▶</button></div>
<script>
const OR='#F57C00',BL='#1565C0',BK='#111',MG='#9AA3AE';
const C=(b,l,c)=>`<div class="card"><b style="color:${c}">${b}</b><span>${l}</span></div>`;
const T=(r,hi=-1)=>'<table>'+r.map((x,i)=>`<tr${i==hi?' class="hi"':''}>`+x.map(c=>i?`<td>${c}</td>`:`<th>${c}</th>`).join('')+'</tr>').join('')+'</table>';
const L=a=>'<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>';
const cols=(t,lab,v,c,mx,f='',fl=0)=>`<div class="ct">${t}</div><div class="cols">`+v.map((x,i)=>`<div class="col"><em>${x}${f}</em><i style="height:${(x-fl)/(mx-fl)*200}px;background:${Array.isArray(c)?c[i]:c}"></i><u>${lab[i]}</u></div>`).join('')+'</div>';
const hb=(l,segs,mx=100)=>`<div class="hb"><s>${l}</s><div>`+segs.map(s=>`<i style="width:${s[0]/mx*100}%;background:${s[1]}">${s[2]??''}</i>`).join('')+'</div></div>';
const G='#B8C0CC';
const S=[];const add=(p,t,h,i,d)=>{S.push({p,t,h,i,d});return S[S.length-1]};
const LC=(t,lab,v,c)=>{const mn=Math.min(...v),mx=Math.max(...v),X=i=>40+i*(500/(v.length-1)),Y=x=>200-(x-mn)/(mx-mn)*170;return `<div class="ct">${t}</div><svg viewBox="0 0 580 240" style="width:100%"><polyline fill="none" stroke="${c}" stroke-width="3" points="${v.map((x,i)=>X(i)+','+Y(x)).join(' ')}"/>`+v.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x)}" r="5" fill="${c}"/><text x="${X(i)}" y="${Y(x)-10}" text-anchor="middle" font-size="12" font-weight="700">${x}</text><text x="${X(i)}" y="226" text-anchor="middle" font-size="12" fill="#5F6B7A">${lab[i]}</text>`).join('')+'</svg>'};
const PR=(lab,a,b)=>`<div class="cols">`+lab.map((l,i)=>`<div class="col"><div style="display:flex;gap:6px;justify-content:center;align-items:flex-end"><div style="width:40%"><em>${a[i]}</em><i style="width:100%;height:${a[i]*2.6}px;background:${BL}"></i></div><div style="width:40%"><em>${b[i]}</em><i style="width:100%;height:${b[i]*2.6}px;background:${OR}"></i></div></div><u>${l}</u></div>`).join('')+`</div><p class="mut"><span class="bl">■ Approval rate %</span> &nbsp; <span class="hl">■ Model error %</span></p>`;
const SC=(l,v)=>`<div style="text-align:center"><div style="width:130px;height:300px;display:flex;flex-direction:column-reverse;border-radius:6px;overflow:hidden;color:#fff;font-weight:700">`+[[v[0],BK],[v[1],G],[v[2],OR]].map(x=>`<div style="height:${x[0]}%;background:${x[1]};display:flex;align-items:center;justify-content:center">${x[0].toFixed(1)}</div>`).join('')+`</div><div class="mut" style="margin-top:6px">${l}</div></div>`;
const NOTE=(t,x='')=>`<p class="mut" style="margin-top:14px;${x}">${t}</p>`;
// 1
add(0,'',`<div style="position:absolute;right:-90px;top:-110px;width:420px;height:420px;border-radius:50%;background:${OR}"></div><div style="position:absolute;right:-60px;bottom:-130px;width:340px;height:340px;border-radius:50%;background:${BL}"></div>
<p style="color:${OR};font-weight:700;margin-top:110px">MUC02 · Phase 2 · BFSI Retail Lending</p><h1 style="font-size:64px;margin:14px 0">Credit Pre-Screening Engine</h1><p style="font-size:24px;color:#D0D5DB;max-width:640px">Loan Intake Optimisation: how much of the manual queue can a model safely take over?</p><p style="margin-top:80px;font-size:18px">Part 1: Baseline Pre-Screener &nbsp;|&nbsp; Part 2: Model Comparison &amp; Two-Lane Design</p><p class="mut" style="margin-top:8px">Presented by Guthi Vignesh Babu</p>`,0,1);
// 2
add(0,'Executive summary of Dataset',`<div class="g3">${C('12,000','Applications',OR)}${C('4.56B','Total loan amount',BL)}${C('53%','Approved rate',OR)}${C('47%','Declined rate',BL)}${C('6 Months','1 Apr 2026 – 30 Sep 2026',OR)}${C('60,315','Average monthly income',BL)}</div><p style="margin-top:22px;font-size:17px">Financial data: 12,000 applications from 1 Apr 2026 to 30 Sep 2026, across 4 employment types, 7 loan purposes and 2 genders. Decision is the outcome to explain (“Approved” rate 53%).</p>${NOTE('Stakeholder: Credit Policy Analyst → Head of Retail Lending. Also affected: analysts, applicants, Compliance. The “decision” column records what analysts decided, not repayment.')}`);
// 3
add(0,'The business problem',`<div class="g3">${C('3,000','applications a month',OR)}${C('25 min','manual review each = 1,250 hrs',BL)}${C('~47%','end in a decline, many obvious in a minute',OR)}</div><div class="row" style="margin-top:22px"><div><h2 class="bl">Question</h2>Using six months of history (12,000 applications, Apr–Sep 2026), which applications can skip full manual review, and which model and thresholds should the bank adopt?</div><div><h2 class="hl">Success definition</h2>${L(['Max 5% of auto-declines were approved by the team','Max 5% of fast-tracks were declined by the team','Then maximise the share leaving the manual queue','Accuracy is not the success metric'])}</div></div>${NOTE('Stakeholder: Credit Policy Analyst → Head of Retail Lending. Also affected: analysts, applicants, Compliance. The “decision” column records what analysts decided, not repayment.','font-size:14px')}`);
// 4
add(1,'Baseline Pre-Screener',`<p style="font-size:24px;color:#D0D5DB;max-width:700px;margin-top:20px">Steps 5.1–5.7: clean the data, find what drives approval, build logistic regression, set a safe auto-decline threshold, check fairness</p><div class="big" style="background:${OR}">1</div>`,0,1);
// 5
add(1,'Three cleaning decisions',`<div class="g3">${C('441 rows','missing monthly_income (3.7%)',OR)}${C('1,039 rows','blank credit_score (8.7%)',BL)}${C('20 rows','income above 350,000',OR)}</div><div class="g3" style="margin-top:18px;font-size:17px"><div><b>Fill with the median income of the same employment type</b><p class="mut">86% of blanks are Business Owners and Self-Employed, so one overall median would understate them.</p></div><div><b>Keep and flag as is_ntc (new to credit)</b><p class="mut">Every blank has zero credit history. They are real customers, approved 53.9% of the time.</p></div><div><b>Divide by 12</b><p class="mut">All 20 are exact multiples of 12 and all Salaried: annual pay typed into a monthly field. Left alone they would look falsely safe.</p></div></div><p class="bl" style="margin-top:20px;font-weight:700">No rows dropped: 12,000 of 12,000 kept. Approval rate 52.9%, so the target is fairly balanced.</p>`);
// 6
add(1,'Evidence: income outliers',`<div class="g2">${C('0.5–4%','FOIR if taken as typed: impossible, no one else is near',OR)}${C('0.29','median FOIR after dividing by 12 (others: 0.32)',BL)}${C('55%','approval rate of the 20 rows (others: 53%)',BL)}${C('20 of 20','are Salaried and exact multiples of 12',OR)}</div><p style="margin-top:22px;font-size:18px">Their EMIs and loan amounts look normal (median proposed EMI 13,250 vs 10,400), so income is the odd field, not the loan. About 20 more values between 263,000 and 349,000 are plausible senior salaries and were left unchanged.</p>`);
// 7
add(1,'What drives approval today',`<div class="row"><div>${cols('Approval % by credit score band',['<600','600-649','650-699','700-749','750-799','800+','No score'],[2,3.2,32.5,54.4,77.2,85.2,53.9],BL,100)}</div><div>${cols('Approval % by FOIR band',['<30%','30-40%','40-50%','50-55%','>55%'],[65.5,59,47.8,32.4,15.6],OR,100)}</div></div>${L(['Unwritten policy: a score cliff at 650 (about 3% approved below, 28% just above)','Propose a FOIR cap of 55%, with 50% as an amber level','Gig / Contract approved only 34.9% vs 58.4% Salaried: examined in the fairness check'])}`);
// 8
add(1,'Employment type and thin files',`<div class="row"><div>${cols('Approval % by employment type',['Salaried','Business Owner','Self-Employed','Gig / Contract'],[58.4,51.2,50.6,34.9],[BL,BL,BL,OR],100)}</div><div>${L(['Gig / Contract approval is about 23 points below Salaried: a direct penalty, or lower income and higher FOIR? Tested in the fairness check','New-to-credit applicants are approved 53.9% of the time, level with the 700–749 band, so analysts judge them on other evidence','1,179 applications (9.8%) score below 650 and are almost never approved: the natural source of auto-decline volume'])}</div></div>`);
// 9
add(1,'Logistic regression baseline',`<div class="row"><div><div class="g2">${C('79.1%','accuracy at 0.5 cut-off',BL)}${C('17.7%','good applicants wrongly declined (225 of 1,271)',OR)}</div><p style="margin-top:16px">Why 0.5 is not usable: nearly 1 in 5 creditworthy customers would be turned away. Declined precision 79.1%, recall 75.5%.</p>${NOTE('Reads like the credit team: affordability, bureau score and repayment history lead; city tier and age barely matter.')}</div><div><div class="ct">Top coefficients (+ = towards decline)</div>${[['FOIR',1.22],['Delinquencies',.98],['Gig / Contract',.62],['New to credit',.38],['Credit score',-1.01],['Salaried',-.45]].map(x=>hb(x[0],[[Math.abs(x[1]),x[1]>0?BL:OR,(x[1]>0?'+':'')+x[1]]],1.3)).join('')}</div></div>`);
// 10
add(1,'Confusion matrix in plain words',`<div class="row"><div>${T([['','Pred. Approved','Pred. Declined'],['Actually Approved','1,046','225 wrongly declined'],['Actually Declined','277 waved through','852']])}${L(['225 of 1,271 creditworthy applicants (17.7%) would be wrongly declined at 0.5','277 of 1,129 declines (24.5%) would be missed, which is harmless here as analysts still review them','79% accuracy hides that the model is unsafe to act on at the default cut-off'])}</div><div>${C('79.1%','accuracy · precision (Declined) 79.1%',BL)}<div style="height:14px"></div>${C('75.5%','recall for the Declined class',OR)}${NOTE('Test set: 2,400 applications, 80/20 stratified split, random_state 42.')}</div></div>`);
// 11
add(1,'Coefficients for a credit analyst',`${T([['Factor','Coef.','What it means'],['FOIR','+1.22','Strongest driver: about 0.2 more income on EMIs multiplies decline odds by roughly 3.4'],['Credit score','-1.01','About 60 more points cuts decline odds to roughly a third'],['Delinquencies (24m)','+0.98','Each extra missed payment pushes strongly to decline (about 2.7x odds)'],['Gig / Contract','+0.62','Pushes to decline even after score and FOIR are accounted for'],['Salaried','-0.45','Pushes towards approval']])}${NOTE('Just outside the top five: new-to-credit (+0.38) and Debt Consolidation purpose (+0.35) lean to decline. Loan-to-income, job tenure, age and city tier barely matter. Features are standardised, so sizes are comparable.','font-size:17px')}`);
// 12 interactive
add(1,'Auto-decline threshold: 0.90',`<div class="row" style="margin-top:6px"><div style="flex:1.5"><svg id="ch" viewBox="0 0 620 350" style="width:100%;touch-action:none;background:#fafbfc;border-radius:10px"></svg>
<label>Cut-off (P(decline) ≥) <span id="tv" class="hl"></span></label><input type="range" id="ts" min=".5" max=".95" step=".01" value=".9">
<label>Risk limit: % wrongly declined <span id="lv" class="bl"></span></label><input type="range" id="ls" min="1" max="10" step=".5" value="5"></div>
<div id="kp" style="flex:1"></div></div>`,initThr);
// 13 live table
const rows13=[[.5,'44.9%','1,077','20.9%','225'],[.6,'37.6%','902','16.9%','152'],[.7,'30.8%','738','12.1%','89'],[.8,'23.5%','563','7.1%','40'],[.85,'19.7%','472','5.9% (over limit)','28'],[.9,'15.2%','365','4.7% (within limit)','17'],[.95,'10.0%','240','2.1%','5']];
const s13=add(1,'Threshold table (test set)',`<div id="t13"></div>${NOTE('0.90 is the lowest cut-off that meets the 5% rule, so it auto-declines the most while staying inside risk appetite. The 4.7% rests on only 17 applicants. The last row follows the cut-off you set on the previous slide.','font-size:17px')}`);
s13.r=()=>{const c=window.CUT??.9,k=window.CALC?CALC(c):[15.2,4.7,365,17],ex=rows13.findIndex(r=>Math.abs(r[0]-c)<.001);
 const hdr=['P(decline) cut-off','% auto-declined','Applications','% wrongly declined','Wrongly declined'];
 document.getElementById('t13').innerHTML=T([hdr,...rows13.map(r=>[r[0].toFixed(2),...r.slice(1)]),['Your cut-off '+c.toFixed(2),k[0].toFixed(1)+'%',Math.round(k[2]).toLocaleString(),k[1].toFixed(1)+'%',Math.round(k[3])]],ex<0?-1:ex+1)};
// 14
add(1,'Fairness check and interim briefing',`<div class="row"><div>${T([['','Female','Male'],['Historical approval','50.4%','54.1%'],['Median income','45,000','55,000'],['Gig / Contract share','21.4%','11.6%'],['Model auto-decline (0.90)','15.6%','15.0%']])}${L(['The gap is largely mix: women are almost twice as likely to be gig workers','The model does not widen it (0.6 pt vs 3.9 pt historical)','Gender is never a feature, but employment type and income act as proxies, so monitor outcomes by gender'])}</div><div class="card" style="background:${BK};color:#fff"><h2 class="hl">Interim briefing</h2>Logistic regression at P(decline) ≥ 0.90 frees about 456 applications and 190 hours a month.<br><br>Weakness for Part 2: it can only decline. Nothing for clear approvals, so most of the queue is untouched.</div></div>`);
// 15
add(2,'Model Comparison & Two-Lane Design',`<p style="font-size:24px;color:#D0D5DB;max-width:700px;margin-top:20px">Steps 5.8–5.11: package a pipeline, compare four models, add a fast-track lane, and make the recommendation</p><div class="big" style="background:${BL}">2</div>`,0,1);
// 16
add(2,'Pipeline reproduces the baseline',`<div class="row"><div>${T([['Metric','Step 5.4','Pipeline'],['Accuracy','0.7908','0.7904'],['Precision (Declined)','0.7911','0.7909'],['Recall (Declined)','0.7547','0.7538'],['Errors (FP / FN)','225 / 277','225 / 278']])}</div><div>${T([['Latest application','Score','Actual','P(decline)'],['APP111996','684','Declined','0.526'],['APP111997','743','Declined','0.847'],['APP111998','666','Approved','0.571'],['APP111999','685','Approved','0.247'],['APP112000','655','Approved','0.404']])}</div></div>${NOTE('One applicant differs because the pipeline learns income medians from training rows only (Business Owner 71,000 vs 69,500 on all data). That is the leakage point: all preparation is learned on training data and re-applied identically to new raw rows, so nothing from test or future data leaks in, and one file can be versioned, audited and deployed.','font-size:17px')}`);
// 17
add(2,'Cross-validation results',`${T([['Model (5-fold, train only)','ROC-AUC','Accuracy','Precision','Recall'],['Logistic Regression','0.868','77.5%','78.0%','72.7%'],['Decision Tree (depth 5)','0.863','78.2%','80.8%','70.5%'],['Random Forest','0.884','79.5%','79.6%','75.9%'],['Gradient Boosting','0.889','80.0%','81.2%','74.8%']],4)}${NOTE('Precision and recall are for the Declined class. Fold-to-fold spread in AUC is only 0.003–0.006, so the 2-point gain of Gradient Boosting over logistic regression is real. The test set was touched once, at the end.','font-size:18px')}`);
// 18
add(2,'Gradient Boosting wins on ranking',`<div class="row"><div>${cols('5-fold CV ROC-AUC (training set only)',['Logistic Reg.','Decision Tree','Random Forest','Gradient Boosting'],[0.868,0.863,0.884,0.889],[MG,MG,MG,OR],.92,'',.8)}</div><div>${C('0.885','test AUC vs 0.867 for logistic regression',OR)}${L(['Top 3 features carry 88% of importance: delinquencies 30%, credit score 29%, FOIR 29%. This matches 5.2 and 5.3','Keep logistic regression as the transparent benchmark and add reason codes for every auto-decline','Single Pipeline (cleaning to prediction) learns medians from training rows only, so no data leakage'])}${NOTE('Test set used once, after cross-validation.')}</div></div>`);
// 19
add(2,'Feature importances (top 8)',`<div class="row"><div><div class="ct">Gradient Boosting importance (share of total)</div>${[['Delinquencies',.304],['Credit score',.290],['FOIR',.287],['Years in job',.029],['New to credit',.020],['Gig / Contract',.019],['Loan-to-income',.016],['Salaried',.015]].map(x=>hb(x[0],[[x[1],x[1]>.2?OR:BL,x[1].toFixed(3)]],.34)).join('')}</div><div>${C('88%','of importance in just three features',OR)}${L(['Delinquencies, score and FOIR match the 650 cliff and 55% FOIR drop from 5.2 and 5.3','Importance shows how much, not which direction: keep logistic coefficients and add reason codes for each auto-decline'])}</div></div>`);
// 20
add(2,'Searching threshold pairs',`<div class="row"><div>${T([['','Logistic Reg.','Gradient Boosting'],['Cut-offs (low / high)','0.10 / 0.89','0.17 / 0.90'],['Auto-decline lane','15.2%','24.2%'],['Analyst review','68.0%','58.2%'],['Fast-track lane','16.8%','17.6%'],['Wrongly auto-declined','4.7%','4.8%'],['Wrongly fast-tracked','4.7%','3.8%']])}</div><div class="card" style="background:${BK};color:#fff"><h2 class="hl">Stability warning</h2>Cut-offs tuned on the 2,400 test rows look flattering. On 9,600 out-of-fold training predictions, Gradient Boosting shows 5.3% wrongly auto-declined and logistic regression 5.1% wrongly fast-tracked.<br><br>Fix: tune on out-of-fold data, check once on test. Gradient Boosting then uses 0.15 / 0.88.</div></div>`);
// 21 interactive lanes
add(2,'Two lanes automate far more',`<div class="row"><div style="display:flex;gap:40px;justify-content:center;align-items:flex-end">${SC('Logistic Reg.',[16.2,68.1,15.7])}<div id="gbcol"></div><div class="mut" style="align-self:center;font-size:14px">■ auto-decline<br>■ analyst review<br><span class="hl">■ fast-track</span></div></div><div style="flex:1.1"><div id="k2"></div><label style="margin-top:12px">Auto-decline below <span id="lo" class="hl"></span></label><input type="range" id="ls2" min=".10" max=".20" step=".01" value=".15"><label>Fast-track at or above <span id="hi" class="bl"></span></label><input type="range" id="hs2" min=".84" max=".92" step=".01" value=".88"><p style="margin-top:8px"><button id="p1" class="badge" style="background:${BL};border:0;cursor:pointer">0.15 / 0.88 (chosen)</button> <button id="p2" class="badge" style="background:${BK};border:0;cursor:pointer">0.17 / 0.90 (test-tuned)</button></p></div></div>${NOTE('Cut-offs 0.15 (auto-decline) and 0.88 (fast-track), tuned on out-of-fold data and checked once on test. Both 5% limits hold to about ±1 point (4.0% and 5.3% on test). Sliders: exact at the two measured settings, linear estimate around them.','font-size:14px;margin-top:6px')}`,initLane);
// 22

// ---------- Part 1: threshold explorer (notebook cell 31 measured points, 2,400 test apps) ----------
function initThr(root){
 const TT=[.5,.6,.7,.8,.85,.9,.95],N=[1077,902,738,563,472,365,240],W=[225,152,89,40,28,17,5];
 const ip=(a,t)=>{let i=0;while(i<5&&t>TT[i+1])i++;return a[i]+(a[i+1]-a[i])*(t-TT[i])/(TT[i+1]-TT[i])};
 const sh=t=>ip(N,t)/24,wr=t=>ip(W,t)/ip(N,t)*100;
 const X=t=>50+(t-.5)/.45*540,Y=p=>320-p/50*290;let t=.9,lim=5;
 const $=id=>root.querySelector(id),ch=$('#ch');
 const path=f=>{let d='';for(let x=.5;x<=.9501;x+=.01)d+=(d?'L':'M')+X(x).toFixed(1)+','+Y(f(x)).toFixed(1);return d};
 function draw(){
  let g='';for(let p=0;p<=50;p+=10)g+=`<line x1="50" x2="590" y1="${Y(p)}" y2="${Y(p)}" stroke="#e3e6ea"/><text x="40" y="${Y(p)+4}" text-anchor="end" font-size="11" fill="#5F6B7A">${p}%</text>`;
  for(let x=.5;x<=.951;x+=.1)g+=`<text x="${X(x)}" y="340" text-anchor="middle" font-size="11" fill="#5F6B7A">${x.toFixed(1)}</text>`;
  g+=`<path d="${path(sh)}" fill="none" stroke="${BL}" stroke-width="3"/><path d="${path(wr)}" fill="none" stroke="${OR}" stroke-width="3"/>`;
  TT.forEach((x,i)=>g+=`<circle cx="${X(x)}" cy="${Y(N[i]/24)}" r="3.5" fill="#fff" stroke="${BL}"/><circle cx="${X(x)}" cy="${Y(W[i]/N[i]*100)}" r="3.5" fill="#fff" stroke="${OR}"/>`);
  g+=`<line class="drag" x1="50" x2="590" y1="${Y(lim)}" y2="${Y(lim)}" stroke="#666" stroke-dasharray="6 4" stroke-width="2"/><text x="590" y="${Y(lim)-6}" text-anchor="end" font-size="12" font-weight="700" fill="#444">${lim}% risk limit</text>`;
  g+=`<line x1="${X(t)}" x2="${X(t)}" y1="20" y2="320" stroke="${BK}" stroke-width="2.5"/><circle cx="${X(t)}" cy="${Y(sh(t))}" r="6" fill="${BL}"/><circle cx="${X(t)}" cy="${Y(wr(t))}" r="6" fill="${OR}"/><text x="${X(t)}" y="14" text-anchor="middle" font-size="13" font-weight="700">cut-off ${t.toFixed(2)}</text>`;
  g+=`<text x="60" y="44" font-size="12" fill="${BL}" font-weight="700">— % of applications auto-declined</text><text x="60" y="60" font-size="12" fill="${OR}" font-weight="700">— % of those the team approved</text>`;
  ch.innerHTML=g;
  window.CUT=t;window.CALC=q=>[sh(q),wr(q),ip(N,q),ip(W,q)];const s=sh(t),w=wr(t),n=ip(N,t),wn=ip(W,t),apps=s*30,hrs=apps*25/60,ok=w<=lim;
  let rec=null;for(let x=.5;x<=.9501;x+=.01)if(wr(x)<=lim){rec=+x.toFixed(2);break}
  $('#tv').textContent=t.toFixed(2);$('#lv').textContent=lim+'%';$('#ts').value=t;$('#ls').value=lim;
  $('#kp').innerHTML=`<div class="g2">${C(s.toFixed(1)+'%','auto-declined ('+Math.round(n)+' of 2,400)',BL)}${C(w.toFixed(1)+'%','wrongly declined ('+Math.round(wn)+' of '+Math.round(n)+')',OR)}${C(Math.round(apps),'apps/month leave manual review',BL)}${C(Math.round(hrs)+' hrs','of 1,250 analyst hours freed',OR)}</div><p style="margin:14px 0"><span class="badge ${ok?'ok':'bad'}">${ok?'Within':'Over'} the ${lim}% limit</span></p><p style="font-size:17px">${rec?`Lowest safe cut-off: <b>${rec.toFixed(2)}</b> <button id="jr" class="badge" style="background:${OR};border:0;cursor:pointer">Jump</button>`:'No cut-off in 0.50–0.95 meets this limit.'}</p><p class="mut" style="margin-top:10px">Exact at the 7 measured points (hollow dots); linear between them. At 0.90 the 4.7% rests on just 17 applicants.</p>`;
  const j=$('#jr');if(j)j.onclick=()=>{t=rec;draw()}};
 const pt=e=>{const r=ch.getBoundingClientRect();return[(e.clientX-r.left)/r.width*620,(e.clientY-r.top)/r.height*350]};let mode=0;
 ch.onpointerdown=e=>{const[x,y]=pt(e);mode=Math.abs(y-Y(lim))<14?2:1;ch.setPointerCapture(e.pointerId);ch.onpointermove(e)};
 ch.onpointermove=e=>{if(!mode)return;const[x,y]=pt(e);if(mode==1)t=Math.max(.5,Math.min(.95,Math.round((.5+(x-50)/540*.45)*100)/100));else lim=Math.max(1,Math.min(10,Math.round((50*(320-y)/290)*2)/2));draw()};
 ch.onpointerup=()=>mode=0;
 $('#ts').oninput=e=>{t=+e.target.value;draw()};$('#ls').oninput=e=>{lim=+e.target.value;draw()};draw()}
// ---------- two-lane explorer (anchors: 0.15→544 auto/22 wrong, 0.17→582/28; 0.88→487 fast/26 wrong, 0.90→422/16) ----------
function initLane(root){
 const $=id=>root.querySelector(id);
 const nA=l=>544+(l-.15)*1900,wA=l=>Math.max(0,22+(l-.15)*300),nF=h=>Math.max(0,487-(h-.88)*3250),wF=h=>Math.max(0,26-(h-.88)*500);
 function draw(){const l=+$('#ls2').value,h=+$('#hs2').value,a=nA(l),f=nF(h),pa=a/24,pf=f/24,pr=100-pa-pf,ea=wA(l)/a*100,ef=wF(h)/f*100;
  $('#lo').textContent=l.toFixed(2);$('#hi').textContent=h.toFixed(2);$('#gbcol').innerHTML=SC('Gradient Boosting (live)',[pa,pr,pf]);
  const apps=(a+f)/2400*3000,hrs=apps*25/60,b=v=>`<span class="badge ${v<=5?'ok':'bad'}">${v<=5?'OK':'Over 5%'}</span>`;
  $('#k2').innerHTML=`<div class="g2">${C(Math.round(pa+pf)+'%','of queue automated (vs 32% for logistic regression)',OR)}${C('~'+Math.round(hrs)+' hrs','freed a month, about '+Math.round(hrs-399)+' more than logistic regression',BL)}</div><p style="margin-top:10px;font-size:16px">Wrongly auto-declined <b>${ea.toFixed(1)}%</b> ${b(ea)} &nbsp; Wrongly fast-tracked <b>${ef.toFixed(1)}%</b> ${b(ef)}</p>`}
 $('#ls2').oninput=draw;$('#hs2').oninput=draw;
 $('#p1').onclick=()=>{$('#ls2').value=.15;$('#hs2').value=.88;draw()};$('#p2').onclick=()=>{$('#ls2').value=.17;$('#hs2').value=.9;draw()};draw()}
fit();go(+location.hash.slice(1)-1||0);
